<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img" aria-labelledby="title desc">
  <title id="title">Minimax value backup</title><desc id="desc">A MAX root chooses between two MIN nodes whose values are determined by their lowest-valued leaves.</desc>
  <style>text{font:600 15px system-ui,sans-serif;fill:#24292f}.node{fill:#f6f8fa;stroke:#57606a;stroke-width:2}.max{fill:#ddf4ff;stroke:#0969da;stroke-width:2}.min{fill:#fff8c5;stroke:#9a6700;stroke-width:2}.line{stroke:#57606a;stroke-width:2}@media(prefers-color-scheme:dark){text{fill:#c9d1d9}.node{fill:#161b22;stroke:#8b949e}.max{fill:#0c2d6b;stroke:#58a6ff}.min{fill:#341a00;stroke:#d29922}.line{stroke:#8b949e}}</style>
  <line class="line" x1="400" y1="90" x2="230" y2="155"/><line class="line" x1="400" y1="90" x2="570" y2="155"/>
  <line class="line" x1="230" y1="215" x2="140" y2="275"/><line class="line" x1="230" y1="215" x2="320" y2="275"/><line class="line" x1="570" y1="215" x2="480" y2="275"/><line class="line" x1="570" y1="215" x2="660" y2="275"/>
  <rect class="max" x="275" y="25" width="250" height="65" rx="8"/><text x="400" y="64" text-anchor="middle">MAX: max(3, 2) = 3</text>
  <rect class="min" x="115" y="155" width="230" height="60" rx="8"/><text x="230" y="191" text-anchor="middle">MIN: min(3, 8) = 3</text>
  <rect class="min" x="455" y="155" width="230" height="60" rx="8"/><text x="570" y="191" text-anchor="middle">MIN: min(2, 6) = 2</text>
  <circle class="node" cx="140" cy="292" r="27"/><text x="140" y="298" text-anchor="middle">3</text><circle class="node" cx="320" cy="292" r="27"/><text x="320" y="298" text-anchor="middle">8</text><circle class="node" cx="480" cy="292" r="27"/><text x="480" y="298" text-anchor="middle">2</text><circle class="node" cx="660" cy="292" r="27"/><text x="660" y="298" text-anchor="middle">6</text>
</svg>
