<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" role="img" aria-labelledby="title desc">
  <title id="title">Local-search loop</title><desc id="desc">Generate neighbors, choose a promising state, and repeat until a stop condition is met.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" class="arrow"/></marker></defs>
  <style>text{font:600 15px system-ui,sans-serif;fill:#24292f}.label{font-size:13px;font-weight:400}.box{fill:#f6f8fa;stroke:#57606a;stroke-width:2}.decision{fill:#fff8c5;stroke:#9a6700;stroke-width:2}.line{fill:none;stroke:#57606a;stroke-width:2;marker-end:url(#arrow)}.arrow{fill:#57606a}@media(prefers-color-scheme:dark){text{fill:#c9d1d9}.box{fill:#161b22;stroke:#8b949e}.decision{fill:#341a00;stroke:#d29922}.line{stroke:#8b949e}.arrow{fill:#8b949e}}</style>
  <rect class="box" x="20" y="35" width="160" height="65" rx="8"/><text x="100" y="74" text-anchor="middle">Current state</text>
  <rect class="box" x="230" y="35" width="180" height="65" rx="8"/><text x="320" y="74" text-anchor="middle">Generate neighbors</text>
  <rect class="box" x="460" y="35" width="190" height="65" rx="8"/><text x="555" y="74" text-anchor="middle">Choose promising state</text>
  <path class="decision" d="M750 20 L850 67 L750 115 L650 67 Z"/><text x="750" y="63" text-anchor="middle">Stop</text><text x="750" y="82" text-anchor="middle">condition?</text>
  <rect class="box" x="760" y="145" width="180" height="55" rx="8"/><text x="850" y="179" text-anchor="middle">Return best state</text>
  <line class="line" x1="180" y1="67" x2="230" y2="67"/><line class="line" x1="410" y1="67" x2="460" y2="67"/><line class="line" x1="650" y1="67" x2="651" y2="67"/><path class="line" d="M750 115 V145 H760"/><text class="label" x="733" y="136">Yes</text><path class="line" d="M650 67 H625 V130 H320 V100"/><text class="label" x="612" y="57">No</text>
</svg>
