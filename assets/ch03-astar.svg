<svg xmlns="http://www.w3.org/2000/svg" width="850" height="190" viewBox="0 0 850 190" role="img" aria-labelledby="title desc">
  <title id="title">A-star evaluation function</title><desc id="desc">A-star combines path cost so far and estimated cost remaining.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" class="arrow"/></marker></defs>
  <style>text{font:600 17px system-ui,sans-serif;fill:#24292f}.sub{font-size:14px;font-weight:400}.box{fill:#f6f8fa;stroke:#57606a;stroke-width:2}.result{fill:#ddf4ff;stroke:#0969da;stroke-width:2}.line{fill:none;stroke:#57606a;stroke-width:2;marker-end:url(#arrow)}.arrow{fill:#57606a}@media(prefers-color-scheme:dark){text{fill:#c9d1d9}.box{fill:#161b22;stroke:#8b949e}.result{fill:#0c2d6b;stroke:#58a6ff}.line{stroke:#8b949e}.arrow{fill:#8b949e}}</style>
  <rect class="box" x="25" y="20" width="250" height="65" rx="8"/><text x="150" y="48" text-anchor="middle">g(n)</text><text class="sub" x="150" y="70" text-anchor="middle">cost so far</text>
  <rect class="box" x="25" y="105" width="250" height="65" rx="8"/><text x="150" y="133" text-anchor="middle">h(n)</text><text class="sub" x="150" y="155" text-anchor="middle">estimated cost left</text>
  <rect class="result" x="430" y="55" width="370" height="80" rx="8"/><text x="615" y="103" text-anchor="middle">A*: f(n) = g(n) + h(n)</text>
  <path class="line" d="M275 52 H350 Q380 52 430 82"/><path class="line" d="M275 137 H350 Q380 137 430 108"/>
</svg>
