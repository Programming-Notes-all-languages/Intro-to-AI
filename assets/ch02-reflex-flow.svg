<svg xmlns="http://www.w3.org/2000/svg" width="820" height="130" viewBox="0 0 820 130" role="img" aria-labelledby="title desc">
  <title id="title">Simple reflex agent flow</title><desc id="desc">The current percept is interpreted, matched to a rule, and converted into an action.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" class="arrow"/></marker></defs>
  <style>text{font:600 16px system-ui,sans-serif;fill:#24292f}.box{fill:#f6f8fa;stroke:#57606a;stroke-width:2}.line{stroke:#57606a;stroke-width:2;marker-end:url(#arrow)}.arrow{fill:#57606a}@media(prefers-color-scheme:dark){text{fill:#c9d1d9}.box{fill:#161b22;stroke:#8b949e}.line{stroke:#8b949e}.arrow{fill:#8b949e}}</style>
  <rect class="box" x="20" y="30" width="160" height="70" rx="8"/><text x="100" y="71" text-anchor="middle">Current percept</text>
  <rect class="box" x="230" y="30" width="160" height="70" rx="8"/><text x="310" y="71" text-anchor="middle">Interpret input</text>
  <rect class="box" x="440" y="30" width="150" height="70" rx="8"/><text x="515" y="71" text-anchor="middle">Match rule</text>
  <rect class="box" x="640" y="30" width="150" height="70" rx="8"/><text x="715" y="71" text-anchor="middle">Action</text>
  <line class="line" x1="180" y1="65" x2="230" y2="65"/><line class="line" x1="390" y1="65" x2="440" y2="65"/><line class="line" x1="590" y1="65" x2="640" y2="65"/>
</svg>
