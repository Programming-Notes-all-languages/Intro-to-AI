<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-labelledby="title desc">
  <title id="title">Hill-climbing state-space landscape</title><desc id="desc">Hill climbing ascends from the start to a local maximum and cannot cross a valley to reach the higher global maximum.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" class="arrow"/></marker></defs>
  <style>text{font:600 15px system-ui,sans-serif;fill:#24292f}.axis,.hill{fill:none;stroke:#57606a;stroke-width:2}.climb{fill:none;stroke:#1a7f37;stroke-width:4;marker-end:url(#arrow)}.arrow{fill:#1a7f37}.point{fill:#1a7f37}@media(prefers-color-scheme:dark){text{fill:#c9d1d9}.axis,.hill{stroke:#8b949e}.climb{stroke:#3fb950}.arrow,.point{fill:#3fb950}}</style>
  <line class="axis" x1="50" y1="225" x2="860" y2="225"/>
  <path class="hill" d="M60 215 C130 205 160 130 240 115 C310 103 340 185 420 205 C520 230 560 170 625 145 C690 120 720 45 835 30"/>
  <circle class="point" cx="95" cy="204" r="6"/><text x="80" y="245">Start</text>
  <circle class="point" cx="240" cy="115" r="6"/><text x="185" y="92">Local maximum</text>
  <circle class="point" cx="835" cy="30" r="6"/><text x="735" y="22">Global maximum</text>
  <path class="climb" d="M102 199 C145 180 175 130 232 118"/>
  <text x="350" y="180">worse moves required to escape</text>
</svg>
