<svg xmlns="http://www.w3.org/2000/svg" width="900" height="130" viewBox="0 0 900 130" role="img" aria-labelledby="title desc">
  <title id="title">Problem-solving process</title><desc id="desc">Formulate a goal, formulate the problem, search for a solution, and execute the actions.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" class="arrow"/></marker></defs>
  <style>text{font:600 16px system-ui,sans-serif;fill:#24292f}.box{fill:#f6f8fa;stroke:#57606a;stroke-width:2}.line{stroke:#57606a;stroke-width:2;marker-end:url(#arrow)}.arrow{fill:#57606a}@media(prefers-color-scheme:dark){text{fill:#c9d1d9}.box{fill:#161b22;stroke:#8b949e}.line{stroke:#8b949e}.arrow{fill:#8b949e}}</style>
  <rect class="box" x="15" y="30" width="180" height="70" rx="8"/><text x="105" y="71" text-anchor="middle">Formulate goal</text>
  <rect class="box" x="240" y="30" width="190" height="70" rx="8"/><text x="335" y="71" text-anchor="middle">Formulate problem</text>
  <rect class="box" x="475" y="30" width="190" height="70" rx="8"/><text x="570" y="71" text-anchor="middle">Search for solution</text>
  <rect class="box" x="710" y="30" width="175" height="70" rx="8"/><text x="797" y="71" text-anchor="middle">Execute actions</text>
  <line class="line" x1="195" y1="65" x2="240" y2="65"/><line class="line" x1="430" y1="65" x2="475" y2="65"/><line class="line" x1="665" y1="65" x2="710" y2="65"/>
</svg>
